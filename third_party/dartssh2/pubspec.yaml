name: dartssh2
version: 4.1.0
description: SSH and SFTP client written in pure Dart, aiming to be feature-rich as well as easy to use.
homepage: https://github.com/vicajilau/dartssh2
repository: https://github.com/vicajilau/dartssh2
issue_tracker: https://github.com/vicajilau/dartssh2/issues
topics:
  - ssh
  - sftp
  - ssh-client
  - network
  - security

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  asn1lib: ^1.5.8
  convert: ^3.1.2
  meta: ^1.16.0
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0

false_secrets:
  - test
