name: Desktop Release
run-name: Desktop ${{ github.event_name == 'workflow_dispatch' && inputs.build_only && 'Build' || 'Release' }} · ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有版本标签，例如 v1.0.0（必须与 VERSION 的版本号一致）'
        required: false
        type: string
      build_only:
        description: '验证桌面五路及服务端六路构建与测试，不发布 Release；留空 tag 时构建所选分支'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  DART_VERSION: '3.13.5'

jobs:
  # 自托管 Mac mini 在线时承担 macOS 桌面包与服务端 arm64，离线或查询失败回退 macos-15。
  # RUNNER_STATUS_TOKEN 需仓库 Administration 只读权限；未配置时直接回退，不影响发布。
  pick-runner:
    name: Select macOS runner
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Pick self-hosted or hosted macOS runner
        id: pick
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: python3 tools/release/pick_runner.py --label remlark-macmini --fallback macos-15 --output-name macos --github-output "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [pick-runner]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, runner: ubuntu-24.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { platform: windows, arch: x64, runner: windows-2022 }
          - { platform: windows, arch: arm64, runner: windows-11-arm }
          - { platform: macos, arch: universal, runner: macos-15 }
    runs-on: ${{ matrix.runner == 'macos-15' && needs.pick-runner.outputs.macos || matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate application version
        run: python3 tools/utils/app_version.py json
      - name: Validate release tag
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/release/prepare.py validate
      # 从固定的官方源码标签启动 SDK，兼容没有预打包 Flutter SDK 的 ARM64 主机。
      # 网络安装统一经 retry_command.py 有限重试；克隆失败先删除半成品目录。
      # 自托管 runner 缓存到 RUNNER_TOOL_CACHE 跨任务复用（含引擎缓存）；托管 runner 每次克隆到 RUNNER_TEMP。
      - name: Install Flutter
        run: python3 tools/utils/flutter_sdk.py --version "$FLUTTER_VERSION" --github-path "$GITHUB_PATH"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          python3 tools/utils/retry_command.py -- sudo apt-get update
          python3 tools/utils/retry_command.py -- sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev fonts-noto-cjk perl zlib1g-dev nasm libva-dev curl ca-certificates tar zip unzip xdg-utils python3 dpkg-dev desktop-file-utils
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 tools/release/macos_signing.py install
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: python3 tools/utils/retry_command.py -- brew install cmake ninja nasm
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python3 tools/utils/retry_command.py -- choco install make strawberryperl nasm innosetup jom --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency installation failed' }
          @('C:\Strawberry\perl\bin', 'C:\Program Files\NASM', 'C:\Program Files (x86)\Inno Setup 6') | Add-Content $env:GITHUB_PATH
          # FFmpeg 的 configure 需要 MSYS2 的 bash / make；ARM64 镜像未预装 MSYS2 时先安装
          if (-not (Test-Path 'C:\msys64\usr\bin\bash.exe')) {
            python3 tools/utils/retry_command.py -- choco install msys2 --params '/InstallDir:C:\msys64 /NoUpdate' --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'MSYS2 installation failed' }
          }
          python3 tools/utils/retry_command.py -- C:\msys64\usr\bin\bash.exe -lc 'pacman -S --noconfirm --needed make diffutils'
          if ($LASTEXITCODE -ne 0) { throw 'MSYS2 package installation failed' }
      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Identify native cache environment
        id: native-identity
        run: python3 tools/utils/native_build_state.py cache-identity build/native ${{ matrix.platform }} --github-output "$GITHUB_OUTPUT"
      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native/*/prefix
            build/native/*/.completed
            build/native/*/freerdp-features
            build/native/*/remlark_*.dll
            build/native/*/libremlark_*.*
          key: native-v2-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.native-identity.outputs.identity }}-${{ hashFiles('native/**') }}
      # 第三方配方单独作为键；修改胶水 C 代码不应丢弃已完成的 OpenSSL 等依赖。
      - name: Restore completed native stages
        id: native-progress
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            build/native/*/prefix
            build/native/*/.completed
            build/native/*/freerdp-features
            native/rdp/.deps/*.tar.gz
          key: native-progress-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.native-identity.outputs.identity }}-${{ hashFiles('native/rdp/scripts/build.sh', 'native/rdp/scripts/build.ps1', 'native/rdp/scripts/build_ffmpeg_msvc.sh', 'native/utils/windows_build.ps1') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-progress-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ steps.native-identity.outputs.identity }}-${{ hashFiles('native/rdp/scripts/build.sh', 'native/rdp/scripts/build.ps1', 'native/rdp/scripts/build_ffmpeg_msvc.sh', 'native/utils/windows_build.ps1') }}-
      - name: Flutter dependencies
        if: runner.os != 'Windows'
        run: |
          python3 tools/utils/retry_command.py -- flutter config --no-analytics --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop
          python3 tools/utils/retry_command.py -- flutter --version
          make deps
      - name: Platform tests
        if: runner.os != 'Windows'
        run: make test-platform
      - name: Windows Flutter dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python3 tools/utils/retry_command.py -- flutter config --no-analytics --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Flutter configuration failed' }
          python3 tools/utils/retry_command.py -- flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter bootstrap failed' }
          make deps
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependencies failed' }
      - name: Windows platform tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: make test-platform
      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: make linux
      - name: Build Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: make windows WINDOWS_ARCH=${{ matrix.arch }}
      - name: Build macOS universal installer
        if: runner.os == 'macOS'
        run: |
          make mac
          python3 tools/release/macos_signing.py sign-app
          python3 tools/release/prepare.py macos
          python3 tools/release/macos_signing.py sign-dmg
      - name: Clean up macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: python3 tools/release/macos_signing.py cleanup
      # 原生库编译后实际解码 H.264（P-11）：硬件可用时走平台硬件解码，否则软件解码，两者都要颜色正确
      - name: Post-build platform and H.264 decode tests
        if: runner.os != 'Windows'
        env:
          RMK_REQUIRE_RDP_NATIVE: '1'
        run: make test-platform
      - name: Windows post-build platform and H.264 decode tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RMK_REQUIRE_RDP_NATIVE: '1'
        run: |
          make test-platform
          if ($LASTEXITCODE -ne 0) { throw 'Post-build platform tests failed' }
      # 根据完成记录和全部产物摘要判断，不能仅看到一份 RDP DLL 就认定缓存完整。
      - name: Inspect native cache completeness
        id: native-state
        if: always() && steps.native-cache.outcome == 'success'
        run: python3 tools/utils/native_build_state.py cache-status build/native ${{ matrix.platform }} --arch ${{ matrix.arch }} --github-output "$GITHUB_OUTPUT"
      # 后续阶段失败时保存已完成依赖；未完成阶段没有有效记录，下次必须重新构建。
      - name: Save completed native stages
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && steps.native-progress.outputs.cache-primary-key != '' && (steps.native-state.outputs.dependencies == 'true' || hashFiles('native/rdp/.deps/*.tar.gz') != '') && steps.native-state.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/native/*/prefix
            build/native/*/.completed
            build/native/*/freerdp-features
            native/rdp/.deps/*.tar.gz
          key: ${{ steps.native-progress.outputs.cache-primary-key }}
      # 打包失败也保存完整原生库；RDP、SSH 及其依赖必须全部完成。
      - name: Save complete native dependencies
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && steps.native-state.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/native/*/prefix
            build/native/*/.completed
            build/native/*/freerdp-features
            build/native/*/remlark_*.dll
            build/native/*/libremlark_*.*
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload packages
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error
          # 失败后需要保留其他平台包以便 Re-run failed jobs；重跑同名包时覆盖。
          overwrite: true
          retention-days: 7

  server:
    name: server-${{ matrix.platform }}-${{ matrix.arch }}
    needs: [pick-runner]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, runner: ubuntu-24.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { platform: windows, arch: x64, runner: windows-2022 }
          - { platform: windows, arch: arm64, runner: windows-11-arm }
          - { platform: macos, arch: x64, runner: macos-15-intel }
          - { platform: macos, arch: arm64, runner: macos-15 }
    runs-on: ${{ matrix.runner == 'macos-15' && needs.pick-runner.outputs.macos || matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
          architecture: ${{ matrix.arch }}
      - name: Test server packaging
        run: python3 tools/testing/server_bundle_test.py -v
      # 仅安装服务端依赖，不需要 Flutter 或桌面端的 RDP / SSH 原生库。
      - name: Test and build sync server
        working-directory: server
        run: |
          dart pub get --enforce-lockfile
          dart analyze
          dart test
          dart build cli -t bin/server.dart -o ../dist/Remlark-sync-server
      - name: Verify bundle and package sync server
        run: python3 tools/release/server_bundle.py ${{ matrix.platform }} ${{ matrix.arch }} --smoke
      - name: Upload server package
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        uses: actions/upload-artifact@v4
        with:
          name: packages-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/Remlark-sync-server-*.zip
            dist/Remlark-sync-server-*.tar.gz
          if-no-files-found: error
          # 失败后需要保留其他平台包以便 Re-run failed jobs；重跑同名包时覆盖。
          overwrite: true
          retention-days: 7

  publish:
    name: Publish complete release
    needs: [build, server]
    if: github.event_name != 'workflow_dispatch' || !inputs.build_only
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Check complete matrix and generate SHA256SUMS
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/release/prepare.py manifest
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          # 先上传到草稿，全部附件成功后再公开；失败时不会留下可见的半成品 Release。
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Remlark $RELEASE_TAG" --generate-notes
          fi
          python3 tools/utils/retry_command.py -- gh release upload "$RELEASE_TAG" dist/* --clobber
          python3 tools/utils/retry_command.py -- gh release edit "$RELEASE_TAG" --draft=false

  # 只有附件已全部发布到 Release 才删除中转包；任一失败都保留，便于 Re-run failed jobs。
  cleanup:
    name: Remove temporary Actions packages
    needs: [publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      # 仅清理当前运行；历史运行（含失败待重跑的）保留，由保留期过期或手动删除。
      - name: Delete temporary packages of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/cleanup_artifacts.py
