name: Desktop Release
run-name: Desktop ${{ github.event_name == 'workflow_dispatch' && inputs.build_only && 'Build' || 'Release' }} · ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有版本标签，例如 v1.0.0（必须与 VERSION 的版本号一致）'
        required: false
        type: string
      build_only:
        description: '仅验证五路构建、平台测试与安装包，不发布 Release；留空 tag 时构建所选分支'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, runner: ubuntu-24.04 }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { platform: windows, arch: x64, runner: windows-2022 }
          - { platform: windows, arch: arm64, runner: windows-11-arm }
          - { platform: macos, arch: universal, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate application version
        run: python3 tools/utils/app_version.py json
      - name: Validate release tag
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/release/prepare.py validate
      # 从固定的官方源码标签启动 SDK，兼容没有预打包 Flutter SDK 的 ARM64 主机。
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev fonts-noto-cjk perl zlib1g-dev nasm libva-dev curl ca-certificates tar zip unzip xdg-utils python3 dpkg-dev desktop-file-utils
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 tools/release/macos_signing.py install
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja nasm
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install make strawberryperl nasm innosetup jom --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Windows dependency installation failed' }
          @('C:\Strawberry\perl\bin', 'C:\Program Files\NASM', 'C:\Program Files (x86)\Inno Setup 6') | Add-Content $env:GITHUB_PATH
          # FFmpeg 的 configure 需要 MSYS2 的 bash / make；ARM64 镜像未预装 MSYS2 时先安装
          if (-not (Test-Path 'C:\msys64\usr\bin\bash.exe')) {
            choco install msys2 --params '/InstallDir:C:\msys64 /NoUpdate' --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'MSYS2 installation failed' }
          }
          C:\msys64\usr\bin\bash.exe -lc 'pacman -S --noconfirm --needed make diffutils'
          if ($LASTEXITCODE -ne 0) { throw 'MSYS2 package installation failed' }
      - name: Initialize MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: build/native
          key: native-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('native/**') }}
      - name: Flutter dependencies
        if: runner.os != 'Windows'
        run: |
          flutter config --no-analytics --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop
          flutter --version
          make deps
      - name: Platform tests
        if: runner.os != 'Windows'
        run: make test-platform
      - name: Windows Flutter dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          flutter config --no-analytics --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Flutter configuration failed' }
          flutter --version
          make deps
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependencies failed' }
      - name: Windows platform tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: make test-platform
      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: make linux
      - name: Build Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: make windows WINDOWS_ARCH=${{ matrix.arch }}
      - name: Build macOS universal installer
        if: runner.os == 'macOS'
        run: |
          make mac
          python3 tools/release/macos_signing.py sign-app
          python3 tools/release/prepare.py macos
          python3 tools/release/macos_signing.py sign-dmg
      - name: Clean up macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: python3 tools/release/macos_signing.py cleanup
      # 原生库编译后实际解码 H.264（P-11）：硬件可用时走平台硬件解码，否则软件解码，两者都要颜色正确
      - name: Post-build platform and H.264 decode tests
        if: runner.os != 'Windows'
        env:
          RMK_REQUIRE_RDP_NATIVE: '1'
        run: make test-platform
      - name: Windows post-build platform and H.264 decode tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RMK_REQUIRE_RDP_NATIVE: '1'
        run: |
          make test-platform
          if ($LASTEXITCODE -ne 0) { throw 'Post-build platform tests failed' }
      # 打包失败时仍保存已经编译完成的原生库，重试无需重复编译 OpenSSL。
      - name: Save complete native dependencies
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && hashFiles('build/native/**/remlark_rdp.dll', 'build/native/**/libremlark_rdp.so', 'build/native/**/libremlark_rdp.dylib') != ''
        uses: actions/cache/save@v4
        with:
          path: build/native
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload native build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/native/**/*.log
          if-no-files-found: ignore

  publish:
    name: Publish complete release
    needs: build
    if: github.event_name != 'workflow_dispatch' || !inputs.build_only
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Check complete matrix and generate SHA256SUMS
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 tools/release/prepare.py manifest
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          # 先上传到草稿，全部附件成功后再公开；失败时不会留下可见的半成品 Release。
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Remlark $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
